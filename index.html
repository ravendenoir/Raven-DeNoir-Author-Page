<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raven DeNoir</title>
<meta name="description" content="Raven DeNoir — Romance author. Love stories with body counts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--bg2:#0f0f0f;--bg3:#161616;--gold:#c9a535;--gold-l:#e8c55a;--gold-d:#7a6010;--text:#e8e0d0;--dim:#888;--border:#222;--pink:#e91e8c;--blue:#00b4e6}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;font-size:14px;line-height:1.6;min-height:100vh}
a{color:inherit;text-decoration:none}
img{display:block}


/* SOCIAL BAR */
.social-bar{background:var(--bg2);border-bottom:1px solid var(--border);padding:20px 24px}
.social-bar-inner{max-width:1100px;margin:0 auto;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.social-bar-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:1px solid var(--border2);border-radius:4px;color:var(--text);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:all .15s;text-decoration:none;background:transparent}
.social-bar-btn:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,165,53,.05)}

/* NAV */
.nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:0;position:sticky;top:0;z-index:50;height:52px;overflow-x:auto}
.nav-brand{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--gold);white-space:nowrap;margin-right:24px}
.nav-links{display:flex;gap:4px;flex:1}
.nav-link{padding:6px 12px;border-radius:4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);white-space:nowrap;transition:all .15s;cursor:pointer}
.nav-link:hover{color:var(--text);background:var(--bg3)}
.nav-socials{display:flex;gap:8px;flex-shrink:0;margin-left:auto}
.nav-social{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);font-size:14px;transition:all .15s;color:var(--text);text-decoration:none}
.nav-social:hover{border-color:var(--gold);background:rgba(201,165,53,.1)}


/* CTA BUTTONS */
.hero-cta-wrap{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.hero-cta-btn{display:block;width:100%;padding:11px 20px;border:1px solid var(--gold-d);color:var(--gold);border-radius:4px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-align:center;transition:all .2s;background:transparent}
.hero-cta-btn:hover{background:var(--gold);color:#000;border-color:var(--gold)}

/* HERO */
.hero{background:linear-gradient(180deg,var(--bg2) 0%,var(--bg) 100%);padding:48px 24px 40px;max-width:1100px;margin:0 auto;display:flex;gap:40px;align-items:flex-start}
.hero-photo{width:260px;min-width:260px;height:390px;border-radius:8px;object-fit:cover;border:3px solid var(--gold);flex-shrink:0;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.hero-photo-ph{width:260px;min-width:260px;height:390px;border-radius:8px;background:var(--bg3);border:3px solid var(--gold-d);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:64px}
.hero-info{flex:1}
.hero-name{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600;color:var(--gold);line-height:1.1;margin-bottom:4px}
.hero-tagline{font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.hero-bio{font-size:14px;color:var(--text);line-height:1.8;max-width:600px;opacity:.85}.hero-bio p{margin-bottom:14px}.hero-bio p:last-child{margin-bottom:0}
.hero-logo{max-height:40px;max-width:200px;margin-top:16px;opacity:.8}
@media(max-width:640px){.hero{flex-direction:column;align-items:center;text-align:center}.hero-name{font-size:32px}}

/* SECTION */
.section{max-width:1100px;margin:0 auto;padding:40px 24px}
.section-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--gold);margin-bottom:6px;letter-spacing:.02em}
.section-bar{width:60px;height:2px;background:var(--gold);margin-bottom:24px;opacity:.5}
.section-2col{display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media(max-width:640px){.section-2col{grid-template-columns:1fr}}

/* DIVIDER */
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:0}


/* CAROUSEL */
.carousel-wrap{background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:0;overflow:hidden;position:relative}
.carousel-track{display:flex;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.carousel-slide{min-width:100%;display:flex;align-items:stretch;min-height:380px}
.carousel-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(18px) brightness(.18);transform:scale(1.1);transition:background-image .5s}
.carousel-content{position:relative;z-index:2;display:flex;gap:40px;align-items:center;max-width:1100px;margin:0 auto;padding:40px 24px;width:100%}
.carousel-cover{width:180px;min-width:180px;height:270px;object-fit:cover;border-radius:6px;border:2px solid rgba(201,165,53,.4);box-shadow:0 20px 60px rgba(0,0,0,.8);flex-shrink:0}
.carousel-cover-ph{width:180px;min-width:180px;height:270px;background:var(--bg3);border-radius:6px;border:2px solid var(--border);flex-shrink:0}
.carousel-info{flex:1}
.carousel-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);opacity:.7;margin-bottom:8px}
.carousel-series{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600;color:var(--text);line-height:1.1;margin-bottom:16px}
.carousel-books{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;max-height:160px;overflow-y:auto}
.carousel-book{display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(232,224,208,.7);transition:color .15s;text-decoration:none}
.carousel-book:hover{color:var(--gold)}
.carousel-book-num{font-size:11px;color:var(--gold-d);font-weight:700;width:24px;flex-shrink:0}
.carousel-btn{display:inline-block;padding:10px 24px;border:1px solid var(--gold);color:var(--gold);border-radius:4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;transition:all .15s;margin-top:4px}
.carousel-btn:hover{background:var(--gold);color:#000}
.carousel-dots{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
.carousel-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .2s;border:none;padding:0}
.carousel-dot.active{background:var(--gold);transform:scale(1.2)}
.carousel-arr{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:rgba(0,0,0,.5);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.carousel-arr:hover{border-color:var(--gold);color:var(--gold)}
.carousel-arr.prev{left:16px}.carousel-arr.next{right:16px}
@media(max-width:640px){.carousel-content{flex-direction:column;align-items:center;text-align:center}.carousel-series{font-size:28px}.carousel-cover{width:130px;min-width:130px;height:195px}}

/* COMING SOON */
.cs-wrap{background:linear-gradient(135deg,var(--bg2),var(--bg3));border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:40px 24px}
.cs-inner{max-width:1100px;margin:0 auto}
.cs-grid{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.cs-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:20px;min-width:220px;max-width:280px;flex:1;text-align:center;transition:border-color .2s}
.cs-card:hover{border-color:var(--gold-d)}
.cs-cover{width:100px;height:150px;object-fit:cover;border-radius:4px;margin-bottom:14px;border:1px solid var(--border)}
.cs-badge{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.cs-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:var(--text);margin-bottom:10px;line-height:1.3}
.cs-countdown{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.cs-unit{text-align:center}
.cs-num{font-size:24px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1;display:block}
.cs-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:block;margin-top:2px}
.cs-sep{font-size:20px;color:var(--gold-d);align-self:flex-start;padding-top:2px}
.cs-btn{display:inline-block;padding:8px 20px;background:var(--gold);color:#000;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;transition:background .15s}
.cs-btn:hover{background:var(--gold-l)}

/* BOOKS GRID */
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:16px}
.book-card{display:flex;flex-direction:column;gap:0;cursor:pointer;text-align:center}
.book-card a{display:flex;flex-direction:column}
.book-cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;border:1px solid var(--border);transition:all .2s}
.book-card:hover .book-cover{border-color:var(--gold-d);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.5)}
.book-card-body{display:flex;flex-direction:column;align-items:center;padding:8px 4px 0;flex:1}
.book-title{font-size:12px;color:var(--text);font-weight:600;line-height:1.3;opacity:.85;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.book-meta{font-size:11px;color:var(--dim);min-height:1.4em;margin-top:2px;margin-bottom:8px}
.book-buy{display:inline-block;padding:5px 14px;background:var(--gold);color:#000;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.04em;transition:background .15s}
.book-buy:hover{background:var(--gold-l)}
.book-ku{display:inline-block;padding:5px 14px;border:1px solid var(--blue);color:var(--blue);border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.04em;transition:all .15s}
.book-ku:hover{background:rgba(0,180,230,.1)}


/* TBR SPLIT */
.tbr-split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start}
.tbr-col-title{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.tbr-featured{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.tbr-featured-cover{width:200px;height:300px;object-fit:cover;border-radius:6px;border:1px solid var(--border);transition:all .2s}
.tbr-featured-cover:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.6)}
.tbr-featured-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--text);letter-spacing:.05em}
.tbr-featured-author{font-size:13px;color:var(--dim)}
.tbr-check-btn{display:inline-block;padding:10px 28px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:4px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;transition:all .15s}
.tbr-check-btn:hover{border-color:var(--gold);color:var(--gold)}
.tbr-new-grid{display:flex;flex-direction:row;gap:24px;flex-wrap:wrap}
.tbr-new-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.tbr-new-cover{width:200px;height:300px;object-fit:cover;border-radius:6px;border:1px solid var(--border);transition:all .2s}
.tbr-new-cover:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.6)}
.tbr-new-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;color:var(--text);letter-spacing:.04em}
.tbr-new-author{font-size:12px;color:var(--dim)}
@media(max-width:640px){.tbr-split{grid-template-columns:1fr}}

/* TBR */
.tbr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.tbr-card a{display:flex;flex-direction:column;gap:8px}
.tbr-cover{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;border:1px solid var(--border);transition:all .2s}
.tbr-card:hover .tbr-cover{border-color:var(--gold-d);transform:translateY(-3px)}
.tbr-title{font-size:12px;color:var(--text);font-weight:600;line-height:1.3}
.tbr-author{font-size:11px;color:var(--dim)}

/* REVIEWS */
.reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.review-item{display:flex;flex-direction:column;gap:12px}
.review-screenshot{width:100%;border-radius:6px;border:1px solid var(--border);object-fit:contain}
.review-buy-btn{display:inline-block;padding:8px 20px;background:var(--gold);color:#000;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:background .15s;width:fit-content}
.review-buy-btn:hover{background:var(--gold-l)}

/* LEAD MAGNET */
.lm-wrap{background:linear-gradient(135deg,rgba(201,165,53,.08),rgba(233,30,140,.05));border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:48px 24px;text-align:center}
.lm-inner{max-width:500px;margin:0 auto}
.lm-headline{font-family:'Cormorant Garamond',serif;font-size:32px;color:var(--gold);margin-bottom:10px}
.lm-sub{font-size:14px;color:var(--dim);margin-bottom:24px}
.lm-cover{max-width:140px;margin:0 auto 20px;border-radius:6px;border:1px solid var(--border)}
.lm-btn{display:inline-block;padding:12px 28px;background:var(--gold);color:#000;border-radius:4px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;transition:background .15s}
.lm-btn:hover{background:var(--gold-l)}

/* EVENTS */
.events-list{display:flex;flex-direction:column;gap:12px}
.event-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px 18px;display:flex;gap:16px;align-items:center}
.event-date{font-size:12px;color:var(--gold);font-weight:700;white-space:nowrap}
.event-info{flex:1}
.event-title{font-size:14px;font-weight:600;color:var(--text)}
.event-meta{font-size:12px;color:var(--dim)}
.event-type{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;background:rgba(201,165,53,.15);color:var(--gold);font-weight:700}

/* CATALOG FULL */
.catalog-series-group{margin-bottom:32px}
.series-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}

/* FOOTER */
.footer{background:var(--bg2);border-top:1px solid var(--border);padding:32px 24px;text-align:center}
.footer-name{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold);margin-bottom:8px}
.footer-links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.footer-link{font-size:12px;color:var(--dim);transition:color .15s}.footer-link:hover{color:var(--gold)}
.footer-copy{font-size:11px;color:var(--dim);opacity:.5}

@media(max-width:600px){.books-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.cs-grid{flex-direction:column;align-items:center}.nav-links{display:none}}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand" id="nav-brand">RAVEN DENOIR</div>
  <div class="nav-links">
    <a class="nav-link" href="#books">Books</a>
    <a class="nav-link" href="#ku">Kindle Unlimited</a>
    <a class="nav-link" href="#tbr">TBR</a>

<div id="events-section"></div>

<section class="section" id="books">
  <div class="section-2col">
    <div>
      <div class="section-title">Top Sellers</div>
      <div class="section-bar"></div>
      <div class="books-grid" id="ts-grid"></div>
    </div>
    <div>
      <div class="section-title">KU Favorites</div>

  </div>

<div class="divider" id="ku"></div>

<script>
document.getElementById('yr').textContent = new Date().getFullYear();

const SOCIAL_ICONS = {newsletter:'📧',amazon:'🛒',patreon:'🎭',tiktok:'🎵',instagram:'📸',facebook:'👥',discord:'💬',goodreads:'📚'};
const SOCIAL_LABELS = {newsletter:'Newsletter',amazon:'Amazon',patreon:'Patreon',tiktok:'TikTok',instagram:'Instagram',facebook:'Facebook',discord:'Discord',goodreads:'Goodreads'};

async function loadData() {
  try {
    const r = await fetch('data.json?v=' + Date.now());
    if (!r.ok) throw new Error('not found');
    return await r.json();
  } catch(e) {
    console.warn('data.json not found, using empty data');
    return null;
  }
}


function renderCarousel(catalog) {
  const sec = document.getElementById('carousel-section');
  if (!sec || !catalog.length) return;
  
  // Group by series, exclude standalones, need 2+ books
  const groups = {};
  catalog.forEach(b => {
    if (!b.series) return;
    if (!groups[b.series]) groups[b.series] = [];
    groups[b.series].push(b);
  });
  const series = Object.entries(groups)
    .filter(([,books]) => books.length >= 1)
    .sort(([,a],[,b]) => b.length - a.length);
  
  if (!series.length) return;

  const slides = series.map(([name, books]) => {
    const sorted = [...books].sort((a,b) => (a.seriesOrder||99) - (b.seriesOrder||99));
    const cover = sorted[0]?.coverUrl || '';
    const booksHtml = sorted.map(b => 
      `<a class="carousel-book" href="${esc(b.amazonUrl||'#')}" target="_blank" rel="noopener">
        <span class="carousel-book-num">#${b.seriesOrder||'?'}</span>
        <span>${esc(b.title)}</span>
      </a>`
    ).join('');
    const amazonUrl = sorted[0]?.amazonUrl || '#';
    return { name, cover, booksHtml, count: books.length, amazonUrl };
  });

  let cur = 0, timer;

  function render() {
    const s = slides[cur];
    const bgEl = document.querySelector('.carousel-bg');
    if (bgEl) bgEl.style.backgroundImage = s.cover ? `url(${esc(s.cover)})` : 'none';
    const track = document.querySelector('.carousel-track');
    if (track) track.style.transform = `translateX(-${cur * 100}%)`;
    document.querySelectorAll('.carousel-dot').forEach((d,i) => d.classList.toggle('active', i === cur));
  }

  function go(n) { cur = (n + slides.length) % slides.length; render(); resetTimer(); }
  function resetTimer() { clearInterval(timer); timer = setInterval(() => go(cur + 1), 5000); }

  const slidesHtml = slides.map((s,i) => `
    <div class="carousel-slide">
      <div class="carousel-content">
        ${s.cover 
          ? `<img src="${esc(s.cover)}" class="carousel-cover" alt="${esc(s.name)}" onerror="this.style.display='none'">`
          : '<div class="carousel-cover-ph"></div>'}
        <div class="carousel-info">
          <div class="carousel-label">Featured Series</div>
          <div class="carousel-series">${esc(s.name)}</div>
          <div style="font-size:12px;color:var(--dim);margin-bottom:12px">${s.count} Book${s.count!==1?'s':''}</div>
          <div class="carousel-books">${s.booksHtml}</div>
          <a href="${esc(s.amazonUrl)}" target="_blank" rel="noopener" class="carousel-btn">Explore Series</a>
        </div>
      </div>
    </div>`).join('');

  const dotsHtml = slides.map((_,i) => `<button class="carousel-dot${i===0?' active':''}" onclick="carouselGo(${i})"></button>`).join('');

  sec.innerHTML = `<div class="carousel-wrap">
    <div class="carousel-bg" style="background-image:${slides[0].cover?`url(${esc(slides[0].cover)})`:'none'}"></div>
    <div class="carousel-track">${slidesHtml}</div>
    <button class="carousel-arr prev" onclick="carouselGo(${-1})">‹</button>
    <button class="carousel-arr next" onclick="carouselGo(${1})">›</button>
    <div class="carousel-dots">${dotsHtml}</div>
  </div>`;

  window.carouselGo = (n) => go(typeof n === 'number' && Math.abs(n) <= 1 && slides.length > 0 ? (n === -1 || n === 1 ? cur + n : n) : n);
  // Fix: prev/next pass relative, dots pass absolute
  window.carouselGo = (n) => { 
    if(n === -1 || n === 1) go(cur + n); 
    else go(n); 
  };
  resetTimer();
}

async function init() {
  const data = await loadData();
  if (!data) return;
  renderProfile(data.profile || {}, data.ctaButtons || []);
  renderSocials(data.socials || {});
  renderComingSoon(data.comingSoon || []);
  renderEvents(data.events || []);
  // Derive top sellers and KU faves from catalog checkboxes
  const catalog = data.catalog || [];
  const topSellers = data.topSellers?.length ? data.topSellers : catalog.filter(b=>b.isTopSeller).map(b=>({id:b.id,title:b.title,amazonUrl:b.amazonUrl,coverUrl:b.coverUrl}));
  const kuFaves = data.kuFavorites?.length ? data.kuFavorites : catalog.filter(b=>b.isKuFave).map(b=>({id:b.id,title:b.title,amazonUrl:b.amazonUrl,coverUrl:b.coverUrl}));
  renderTopSellers(topSellers);
  renderKuFavorites(kuFaves);
  renderTbr(data.tbrList || [], data.favoritesList || []);
  renderLeadMagnet(data.leadMagnet || {});
  renderReviews(data.reviews || []);
  renderCatalog(data.catalog || []);
  renderCarousel(data.catalog || []);
  updateMeta(data.profile || {});
}

function renderProfile(p, ctaButtons) {
  const bio = document.getElementById('hero-bio');
  if (bio && p.bio) bio.innerHTML = p.bio.split(/\n\n+/).map(para => `<p>${para.replace(/\n/g,' ').trim()}</p>`).join('');
  const photoWrap = document.getElementById('hero-photo-wrap');
  if (photoWrap && p.photoUrl) {
    photoWrap.outerHTML = `<div id="hero-photo-col"><img src="${esc(p.photoUrl)}" class="hero-photo" alt="Raven DeNoir" onerror="this.style.display='none'"><div id="hero-cta-wrap" class="hero-cta-wrap"></div></div>`;
  }
  // Render CTA buttons
  const ctaWrap = document.getElementById('hero-cta-wrap');
  if (ctaWrap && ctaButtons && ctaButtons.length) {
    const btns = ctaButtons.filter(b => b.label && b.url);
    if (btns.length) {
      ctaWrap.innerHTML = btns.map(b => `<a href="${esc(b.url)}" target="_blank" rel="noopener" class="hero-cta-btn">${esc(b.label)}</a>`).join('');
    }
  }
}

function renderSocials(s) {
  const nav = document.getElementById('nav-socials');
  const footer = document.getElementById('footer-links');
  const bar = document.getElementById('social-bar-section');
  const navHtml = [], footHtml = [], barHtml = [];
  Object.keys(SOCIAL_ICONS).forEach(k => {
    if (!s[k]) return;
    navHtml.push(`<a class="nav-social" href="${esc(s[k])}" target="_blank" rel="noopener" title="${SOCIAL_LABELS[k]}">${SOCIAL_ICONS[k]}</a>`);
    footHtml.push(`<a class="footer-link" href="${esc(s[k])}" target="_blank" rel="noopener">${SOCIAL_LABELS[k]}</a>`);
    barHtml.push(`<a class="social-bar-btn" href="${esc(s[k])}" target="_blank" rel="noopener">${SOCIAL_ICONS[k]} ${SOCIAL_LABELS[k]}</a>`);
  });
  if (nav) nav.innerHTML = navHtml.join('');
  if (footer) footer.innerHTML = footHtml.join('');
  if (bar && barHtml.length) bar.innerHTML = `<div class="social-bar"><div class="social-bar-inner">${barHtml.join('')}</div></div>`;
}

function renderComingSoon(items) {
  if (!items.length) return;
  const sec = document.getElementById('cs-section');
  const cards = items.map(it => {
    const ts = it.datetime ? new Date(it.datetime).getTime() : 0;
    const cdId = 'cd-' + it.id;
    return `<div class="cs-card">
      ${it.coverUrl ? `<img src="${esc(it.coverUrl)}" class="cs-cover" alt="${esc(it.title)}" onerror="this.style.display='none'">` : ''}
      <div class="cs-badge">Coming Soon</div>
      <div class="cs-title">${esc(it.title)}</div>
      <div class="cs-countdown" id="${cdId}"></div>
      ${it.amazonUrl ? `<a href="${esc(it.amazonUrl)}" target="_blank" rel="noopener" class="cs-btn">Pre-Order Now</a>` : ''}
    </div>`;
  }).join('');
  sec.innerHTML = `<div class="cs-wrap"><div class="cs-inner"><div class="section-title" style="text-align:center;margin-bottom:6px">Coming Soon</div><div class="section-bar" style="margin:0 auto 24px"></div><div class="cs-grid">${cards}</div></div></div>`;
  items.forEach(it => {
    if (!it.datetime) return;
    const target = new Date(it.datetime).getTime();
    const cdEl = document.getElementById('cd-' + it.id);
    if (!cdEl) return;
    function tick() {
      const diff = target - Date.now();
      if (diff <= 0) { cdEl.innerHTML = '<span style="color:var(--gold);font-weight:700;font-size:16px">🎉 Available Now!</span>'; return; }
      const d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
      cdEl.innerHTML = `<div class="cs-unit"><span class="cs-num">${d}</span><span class="cs-lbl">days</span></div><div class="cs-sep">:</div><div class="cs-unit"><span class="cs-num">${pad(h)}</span><span class="cs-lbl">hrs</span></div><div class="cs-sep">:</div><div class="cs-unit"><span class="cs-num">${pad(m)}</span><span class="cs-lbl">min</span></div><div class="cs-sep">:</div><div class="cs-unit"><span class="cs-num">${pad(s)}</span><span class="cs-lbl">sec</span></div>`;
    }
    tick(); setInterval(tick, 1000);
  });
}

function renderEvents(items) {
  if (!items.length) return;
  const sec = document.getElementById('events-section');
  sec.innerHTML = `<section class="section"><div class="section-title">Events & Appearances</div><div class="section-bar"></div><div class="events-list">${items.map(it=>`<div class="event-card">${it.date?`<div class="event-date">${fmtDate(it.date)}</div>`:''}<div class="event-info"><div class="event-title">${esc(it.title)}</div>${it.location?`<div class="event-meta">${esc(it.location)}</div>`:''}</div>${it.type?`<span class="event-type">${esc(it.type)}</span>`:''}</div>`).join('')}</div></section><div class="divider"></div>`;
}

function renderTopSellers(items) {
  const grid = document.getElementById('ts-grid');
  if (!grid) return;
  if (!items.length) { grid.innerHTML = '<div style="color:var(--dim);font-size:13px">Coming soon...</div>'; return; }
  grid.innerHTML = items.map(it => bookCard(it, false)).join('');
}

function renderKuFavorites(items) {
  const grid = document.getElementById('ku-grid');
  if (!grid) return;
  if (!items.length) { grid.innerHTML = '<div style="color:var(--dim);font-size:13px">Coming soon...</div>'; return; }
  grid.innerHTML = items.map(it => bookCard(it, true)).join('');
}

function bookCard(it, isKu) {
  const btn = it.amazonUrl && !isKu
    ? `<a href="${esc(it.amazonUrl)}" target="_blank" rel="noopener" class="book-buy">Buy Now</a>`
    : '';
  return `<div class="book-card">
    <a href="${esc(it.amazonUrl||'#')}" target="_blank" rel="noopener">
      <img src="${esc(it.coverUrl)}" class="book-cover" alt="${esc(it.title)}" onerror="this.style.display='none'">
    </a>
    <div class="book-card-body">
      <div class="book-title">${esc(it.title)}</div>
      <div class="book-meta"></div>
      ${btn}
    </div>
  </div>`;
}

function renderTbr(tbrList, favoritesList) {
  const favEl = document.getElementById('tbr-fav');
  const newEl = document.getElementById('tbr-new');
  const sec = document.getElementById('tbr');
  const fav = favoritesList || [];
  const newBooks = tbrList || [];
  if (!fav.length && !newBooks.length) { if(sec) sec.style.display='none'; return; }

  if (favEl) {
    if (fav.length) {
      const it = fav[0];
      favEl.innerHTML = `<div class="tbr-featured">
        <a href="${esc(it.amazonUrl||'#')}" target="_blank" rel="noopener">
          <img src="${esc(it.coverUrl)}" class="tbr-featured-cover" alt="${esc(it.title)}" onerror="this.style.display='none'">
        </a>
        <div class="tbr-featured-title">${esc(it.title)}</div>
        <div class="tbr-featured-author">by ${esc(it.author)}</div>
        ${it.amazonUrl?`<a href="${esc(it.amazonUrl)}" target="_blank" rel="noopener" class="tbr-check-btn">Check It Out</a>`:''}
      </div>`;
    } else { favEl.innerHTML = ''; }
  }

  if (newEl) {
    if (newBooks.length) {
      newEl.innerHTML = newBooks.map(it => `<div class="tbr-new-card">
        <a href="${esc(it.amazonUrl||'#')}" target="_blank" rel="noopener">
          <img src="${esc(it.coverUrl)}" class="tbr-new-cover" alt="${esc(it.title)}" onerror="this.style.display='none'">
        </a>
        <div class="tbr-new-title">${esc(it.title)}</div>
        <div class="tbr-new-author">by ${esc(it.author)}</div>
        ${it.amazonUrl?`<a href="${esc(it.amazonUrl)}" target="_blank" rel="noopener" class="tbr-check-btn">Check It Out</a>`:''}
      </div>`).join('');
    } else { newEl.innerHTML = ''; }
  }
}

function renderLeadMagnet(lm) {
  if (!lm.enabled) return;
  const sec = document.getElementById('lm-section');
  sec.innerHTML = `<div class="lm-wrap"><div class="lm-inner">${lm.coverUrl?`<img src="${esc(lm.coverUrl)}" class="lm-cover" alt="Freebie">`:''}<div class="lm-headline">${esc(lm.headline)}</div><div class="lm-sub">${esc(lm.subtext)}</div>${lm.buttonUrl?`<a href="${esc(lm.buttonUrl)}" target="_blank" rel="noopener" class="lm-btn">${esc(lm.buttonText)||'Get It Free'}</a>`:''}</div></div><div class="divider"></div>`;
}

function renderReviews(items) {
  const grid = document.getElementById('reviews-grid');
  if (!grid) return;
  const visible = (items||[]).filter(it => it.screenshotBase64 || it.screenshotUrl);
  if (!visible.length) { grid.closest('section').style.display='none'; return; }
  grid.innerHTML = visible.map(it => {
    const ss = it.screenshotBase64 || it.screenshotUrl || '';
    const btn = it.bookAmazonUrl
      ? `<a href="${esc(it.bookAmazonUrl)}" target="_blank" rel="noopener" class="review-buy-btn">Buy Now</a>`
      : '';
    return `<div class="review-item">
      ${ss ? `<img src="${esc(ss)}" class="review-screenshot" alt="Reader review" onerror="this.style.display='none'">` : ''}
      ${btn}
    </div>`;
  }).join('');
}

function renderCatalog(items) {
  const grid = document.getElementById('catalog-grid');
  if (!grid || !items.length) { if(grid) grid.closest('section').style.display='none'; return; }
  // Sort by release date descending — newest first
  const sorted = [...items].sort((a,b) => (b.publishDate||'0000').localeCompare(a.publishDate||'0000'));
  const booksHtml = sorted.map(it => {
    const seriesMeta = it.series ? `${esc(it.series)}${it.seriesOrder?' #'+it.seriesOrder:''}` : 'Standalone';
    const btn = it.amazonUrl
      ? `<a href="${esc(it.amazonUrl)}" target="_blank" rel="noopener" class="book-buy">Buy Now</a>`
      : '';
    return `<div class="book-card">
      <a href="${esc(it.amazonUrl||'#')}" target="_blank" rel="noopener">
        <img src="${esc(it.coverUrl)}" class="book-cover" alt="${esc(it.title)}" onerror="this.style.display='none'">
      </a>
      <div class="book-card-body">
        <div class="book-title">${esc(it.title)}</div>
        <div class="book-meta">${seriesMeta}</div>
        ${btn}
      </div>
    </div>`;
  }).join('');
  grid.innerHTML = `<div class="books-grid">${booksHtml}</div>`;
}

function updateMeta(p) {
  if (p.faviconUrl) {
    const link = document.createElement('link');
    link.rel = 'icon'; link.href = p.faviconUrl;
    document.head.appendChild(link);
  }
  if (p.socialShareImageUrl) {
    const m = document.createElement('meta');
    m.property = 'og:image'; m.content = p.socialShareImageUrl;
    document.head.appendChild(m);
  }
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function pad(n){return n<10?'0'+n:''+n}
function fmtDate(s){try{return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}catch(e){return s}}
function fmtDateShort(s){try{return new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',year:'numeric'})}catch(e){return s}}

init();
</script>
